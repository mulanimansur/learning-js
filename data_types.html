
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Variables</title>
</head>

<body>

    <script>

        var a = "Mansur";              // string
        var b = 167.87;                // number
        var c = true;                  // boolean
        var d = ["HTML", "CSS", "bootstrap", "JS"]; // array
        var e = {
            fname: "sancheet",
            lname: "GROVER"
        };                             // object
        var f = null;                  // null
        var g;                          // undefined

        function myFun() {
            return "Hello";
        }

        // Function call
        document.write(myFun() + "<br>");

        // Display value of b
        document.write(b + "<br>");

        // Display data type of b
        document.write(typeof b);

    </script>

</body>

</html>
